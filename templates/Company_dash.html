<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>College EventSphere - Manage Events Smartly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
    .hero { color: white; padding: 100px 0; text-align: center; }
    .card { transition: 0.3s; }
    .card:hover { transform: translateY(-10px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
  </style>
</head>
<body>
  <div class="container hero">
    <h1 class="display-3 fw-bold">EventSphere</h1>
    <p class="lead">One Platform for All College Events – Plan, Approve, Celebrate & Remember</p>
    <a href="{% url 'event_request' %}" class="btn btn-light btn-lg mt-4">Request New Event</a>
    <a href="{% url 'student_events' %}" class="btn btn-outline-light btn-lg mt-4 ml-3">View Upcoming Events</a>
  </div>

  <div class="container my-5">
    <div class="row">
      <div class="col-md-4">
        <div class="card shadow text-center p-4">
          <i class="mdi mdi-calendar-check display-4 text-primary"></i>
          <h4>Easy Event Requests</h4>
          <p>Clubs can submit event proposals in minutes</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow text-center p-4">
          <i class="mdi mdi-shield-check display-4 text-success"></i>
          <h4>Fast Approvals</h4>
          <p>Admin approves with one click</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow text-center p-4">
          <i class="mdi mdi-robot display-4 text-warning"></i>
          <h4>AI Report Generator</h4>
          <p>Auto-generate beautiful event reports</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
